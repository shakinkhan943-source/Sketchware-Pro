androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

desugar_jdk_libs_nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar_jdk_libs_nio" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
material = { module = "com.google.android.material:material", version.ref = "material" }

sora-editor = { module = "io.github.rosemoe:editor-bom", version.ref = "sora-editor" }
editor = { module = "io.github.rosemoe:editor" }
language-java = { module = "io.github.rosemoe:language-java" }
language-textmate = { module = "io.github.rosemoe:language-textmate" }

bundletool = { module = "com.android.tools.build:bundletool", version.ref = "bundletool" }

circleimageview = { module = "de.hdodenhof:circleimageview", version.ref = "circleimageview" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-kt-coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coilSvg" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

insetter = { module = "dev.chrisbanes.insetter:insetter", version.ref = "insetter" }

javaparser-symbol-solver = { module = "com.github.javaparser:javaparser-symbol-solver-core", version.ref = "javaparserSymbolSolver" }
libsu = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
dependencyresolver = { module = "com.github.Cosmic-Ide:DependencyResolver", version.ref = "dependencyresolver" }
filepicker = { module = "com.github.PranavPurwar:filepicker", version.ref = "filepicker" }

markwon = { module = "io.noties.markwon:core", version.ref = "markwon" }

ecj = { module = "org.eclipse.jdt:ecj", version.ref = "ecj" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlinCompiler" }
kotlinc-for1-sketchware = { module = "com.github.PranavPurwar:kotlinc-android", version.ref = "kotlincForSketchware" }

# Kotlin Compose compiler plugin, bundled as an APK asset and auto-provisioned
# into each project's kt_plugins folder so kotlinc compiles @Composable code.
# Must stay in lockstep with the bundled kotlinc version (kotlinCompiler).
# NOTE: the non-embeddable variant is required - the bundled kotlinc-for-sketchware
# fork is built against the unshaded com.intellij.* compiler classes, so the
# -embeddable plugin (which references org.jetbrains.kotlin.com.intellij.*) fails.
compose-compiler-plugin = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin", version.ref = "kotlinCompiler" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

proguard-core = { module = "com.guardsquare:proguard-core", version.ref = "proguardCore" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufJava" }
# Dual-role artifact (on-device shrinker + build-time D8/R8 override); see the
# `r8` entry in [versions] before touching this or removing the override.
r8 = { module = "com.android.tools:r8", version.ref = "r8" }

scpkix-jdk15on = { module = "com.madgag:scpkix-jdk15on", version.ref = "scpkixJdk15on" }

sdklib = { module = "com.android.tools:sdklib", version.ref = "sdklib" }

woodstox-core = { module = "com.fasterxml.woodstox:woodstox-core", version.ref = "woodstoxCore" }

zipalign-java = { module = "com.github.Iyxan23:zipalign-java", version.ref = "zipalignJava" }

[bundles]
ui = ["androidx-activity", "androidx-appcompat", "androidx-splashscreen", "androidx-recyclerview",
    "androidx-cardview", "androidx-constraintlayout", "androidx-viewpager", "androidx-viewpager2", "androidx-swiperefreshlayout", "material", "lottie",
    "flexbox", "androidx-exifinterface", "androidx-preference"]
image = ["glide", "circleimageview"]
coil = ["coil", "coil-kt-coil-svg"]
networking = ["okhttp", "okio"]
bundletool = ["bundletool", "protobuf-java"]
shrinker = ["r8", "proguard-core"]
kotlin_compiler = ["kotlinc-for1-sketchware", "woodstox-core"]
editor_and_lang = ["editor", "language-java", "language-textmate"]
firebase = ["firebase-analytics", "firebase-crashlytics", "firebase-messaging"]
