name: Constraint Preview Engine Fix

on:
  push:
    branches:
      - fix/constraint-preview
    paths:
      - '.github/workflows/constraint-preview-engine-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ConstraintLayout preview engine
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java')
          s = p.read_text()

          old = '''            int safeIndex = Math.max(0, Math.min(bean.index, viewGroup.getChildCount()));
            viewGroup.addView(view, safeIndex);
            if (bean.parentType == ViewBean.VIEW_TYPE_LAYOUT_RELATIVE) {
                updateRelativeParentViews(view, new InjectAttributeHandler(bean));
            } else if (viewGroup instanceof ItemConstraintLayout constraintLayout) {
                applyConstraintLayoutConstraints(constraintLayout);
            }
'''
          new = '''            int safeIndex = Math.max(0, Math.min(bean.index, viewGroup.getChildCount()));
            viewGroup.addView(view, safeIndex);
            if (viewGroup instanceof ItemConstraintLayout constraintLayout) {
                prepareConstraintChildLayout(constraintLayout, view, bean);
                addAutomaticConstraintPosition(constraintLayout, view, bean);
                applyConstraintLayoutConstraints(constraintLayout);
            } else if (bean.parentType == ViewBean.VIEW_TYPE_LAYOUT_RELATIVE) {
                updateRelativeParentViews(view, new InjectAttributeHandler(bean));
            }
'''
          if old not in s:
              raise SystemExit('addViewAndUpdateIndex anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''    private void applyConstraintLayoutConstraints(ItemConstraintLayout constraintLayout) {\n'''
          if anchor not in s:
              raise SystemExit('constraint method anchor not found')

          helpers = r'''    /** Restores ConstraintLayout-specific dimensions lost by the legacy LayoutBean. */
    private void prepareConstraintChildLayout(ItemConstraintLayout parent, View child, ViewBean bean) {
        if (child.getId() == View.NO_ID) return;
        InjectAttributeHandler handler = new InjectAttributeHandler(bean);
        ViewGroup.LayoutParams current = child.getLayoutParams();
        ConstraintLayout.LayoutParams lp;
        if (current instanceof ConstraintLayout.LayoutParams existing) {
            lp = existing;
        } else {
            int w = bean.layout.width == LayoutBean.LAYOUT_MATCH_PARENT ? 0
                    : bean.layout.width == LayoutBean.LAYOUT_NOTUSED ? ViewGroup.LayoutParams.WRAP_CONTENT
                    : (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.width);
            int h = bean.layout.height == LayoutBean.LAYOUT_MATCH_PARENT ? 0
                    : bean.layout.height == LayoutBean.LAYOUT_NOTUSED ? ViewGroup.LayoutParams.WRAP_CONTENT
                    : (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.height);
            lp = new ConstraintLayout.LayoutParams(w, h);
        }
        String xmlWidth = firstAttribute(handler, "android:layout_width", "layout_width");
        String xmlHeight = firstAttribute(handler, "android:layout_height", "layout_height");
        if (isZeroDp(xmlWidth) || isMatchParent(xmlWidth)) lp.width = 0;
        else if (isWrapContent(xmlWidth)) lp.width = ViewGroup.LayoutParams.WRAP_CONTENT;
        else if (!xmlWidth.isEmpty()) lp.width = resolveDimensionPx(xmlWidth, lp.width);
        if (isZeroDp(xmlHeight) || isMatchParent(xmlHeight)) lp.height = 0;
        else if (isWrapContent(xmlHeight)) lp.height = ViewGroup.LayoutParams.WRAP_CONTENT;
        else if (!xmlHeight.isEmpty()) lp.height = resolveDimensionPx(xmlHeight, lp.height);
        lp.setMargins((int) ViewUtil.dpToPx(getContext(), (float) bean.layout.marginLeft),
                (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.marginTop),
                (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.marginRight),
                (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.marginBottom));
        child.setLayoutParams(lp);
    }

    private String firstAttribute(InjectAttributeHandler handler, String... names) {
        for (String name : names) {
            String value = handler.getAttributeValueOf(name);
            if (value != null && !value.isEmpty()) return value.trim();
        }
        return "";
    }

    private boolean isZeroDp(String value) { return value != null && value.trim().equals("0dp"); }
    private boolean isMatchParent(String value) { return value != null && (value.trim().equals("match_parent") || value.trim().equals("fill_parent")); }
    private boolean isWrapContent(String value) { return value != null && value.trim().equals("wrap_content"); }

    private int resolveDimensionPx(String value, int fallback) {
        try {
            String v = value.trim().toLowerCase();
            if (v.endsWith("dp")) return (int) ViewUtil.dpToPx(getContext(), Float.parseFloat(v.substring(0, v.length() - 2)));
            if (v.endsWith("sp")) return (int) (Float.parseFloat(v.substring(0, v.length() - 2)) * getResources().getDisplayMetrics().scaledDensity);
            if (v.endsWith("px")) return Math.round(Float.parseFloat(v.substring(0, v.length() - 2)));
            return (int) ViewUtil.dpToPx(getContext(), Float.parseFloat(v));
        } catch (NumberFormatException e) { return fallback; }
    }

    private boolean hasExplicitConstraint(InjectAttributeHandler handler) {
        for (Pair<String, String> attribute : handler.getAttributes()) {
            String n = attribute.first;
            if (n != null && (n.startsWith("layout_constraint") || n.startsWith("app:layout_constraint"))) return true;
        }
        return false;
    }

    private void addAutomaticConstraintPosition(ItemConstraintLayout parent, View child, ViewBean bean) {
        InjectAttributeHandler handler = new InjectAttributeHandler(bean);
        if (hasExplicitConstraint(handler) || child.getId() == View.NO_ID) return;
        ConstraintSet set = new ConstraintSet();
        set.clone(parent);
        int childId = child.getId();
        View previous = null;
        for (int i = parent.indexOfChild(child) - 1; i >= 0; i--) {
            View candidate = parent.getChildAt(i);
            if (candidate != null && candidate.getVisibility() == View.VISIBLE && candidate.getId() != View.NO_ID) { previous = candidate; break; }
        }
        set.connect(childId, ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);
        if (previous == null) set.connect(childId, ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);
        else set.connect(childId, ConstraintSet.TOP, previous.getId(), ConstraintSet.BOTTOM, 0);
        set.applyTo(parent);
    }

'''
          s = s.replace(anchor, helpers + anchor, 1)

          old2 = '''            ViewBean bean = itemView.getBean();
            int childId = child.getId();
            if (childId == View.NO_ID) {
                continue;
            }
            InjectAttributeHandler handler = new InjectAttributeHandler(bean);
'''
          new2 = '''            ViewBean bean = itemView.getBean();
            int childId = child.getId();
            if (childId == View.NO_ID) {
                continue;
            }
            prepareConstraintChildLayout(constraintLayout, child, bean);
            InjectAttributeHandler handler = new InjectAttributeHandler(bean);
'''
          if old2 not in s: raise SystemExit('constraint child loop anchor not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          print('ConstraintLayout engine patch applied')
      - name: Compile affected module
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon
      - name: Commit engine fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java
          git commit -m "Fix real ConstraintLayout dimensions and smart placement" || exit 0
          git push origin HEAD:fix/constraint-preview
