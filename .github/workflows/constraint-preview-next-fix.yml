name: Constraint Preview Next Fix

on:
  push:
    branches: [ fix/constraint-preview ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/constraint-preview
          fetch-depth: 0

      - name: Patch ConstraintLayout preview engine
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java')
          s = p.read_text()

          old = '''            if (viewGroup instanceof ItemConstraintLayout constraintLayout) {
                applyConstraintLayoutConstraints(constraintLayout);
            }'''
          new = '''            if (viewGroup instanceof ItemConstraintLayout constraintLayout) {
                applyConstraintLayoutConstraints(constraintLayout);
                applyAutomaticConstraintPlacement(constraintLayout, view, bean);
                applyConstraintLayoutConstraints(constraintLayout);
            }'''
          if old in s:
              s = s.replace(old, new, 1)

          start = s.index('    private void applyConstraintLayoutConstraints(ItemConstraintLayout constraintLayout) {')
          end = s.index('    private void connectConstraint(', start)

          replacement = r'''    private void applyConstraintLayoutConstraints(ItemConstraintLayout constraintLayout) {
        if (constraintLayout.getChildCount() == 0) {
            return;
        }
        ConstraintSet constraintSet = new ConstraintSet();
        constraintSet.clone(constraintLayout);
        for (int i = 0; i < constraintLayout.getChildCount(); i++) {
            View child = constraintLayout.getChildAt(i);
            if (child.getTag() == null || !(child instanceof ItemView itemView)) {
                continue;
            }
            ViewBean bean = itemView.getBean();
            int childId = child.getId();
            if (childId == View.NO_ID) {
                continue;
            }
            InjectAttributeHandler handler = new InjectAttributeHandler(bean);

            // Sketchware's LayoutBean uses 0 for its LAYOUT_NOTUSED value. In
            // ConstraintLayout, an explicit 0dp dimension is MATCH_CONSTRAINT.
            // Re-assert it here so the legacy LayoutBean representation does not
            // accidentally turn 0dp into an ordinary zero-sized child.
            if (bean.layout.width == LayoutBean.LAYOUT_NOTUSED) {
                constraintSet.constrainWidth(childId, 0);
            } else if (bean.layout.width == LayoutBean.LAYOUT_MATCH_PARENT) {
                constraintSet.constrainWidth(childId, 0);
            } else {
                constraintSet.constrainWidth(childId, Math.max(0, (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.width)));
            }
            if (bean.layout.height == LayoutBean.LAYOUT_NOTUSED) {
                constraintSet.constrainHeight(childId, 0);
            } else if (bean.layout.height == LayoutBean.LAYOUT_MATCH_PARENT) {
                constraintSet.constrainHeight(childId, 0);
            } else {
                constraintSet.constrainHeight(childId, Math.max(0, (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.height)));
            }

            for (Pair<String, String> attribute : handler.getAttributes()) {
                applyConstraintAttribute(constraintSet, constraintLayout, childId, bean, attribute.first, attribute.second);
            }
        }
        constraintSet.applyTo(constraintLayout);
        constraintLayout.requestLayout();
        constraintLayout.invalidate();
    }

    /**
     * Give a newly dropped widget a useful deterministic position when the
     * legacy Sketchware widget does not have ConstraintLayout attributes yet.
     * Existing explicit constraints always win.
     */
    private void applyAutomaticConstraintPlacement(ItemConstraintLayout parent, View child, ViewBean bean) {
        if (child == null || child.getId() == View.NO_ID || bean == null) {
            return;
        }
        InjectAttributeHandler handler = new InjectAttributeHandler(bean);
        boolean hasTop = handler.contains("layout_constraintTop_toTopOf") || handler.contains("layout_constraintTop_toBottomOf");
        boolean hasBottom = handler.contains("layout_constraintBottom_toTopOf") || handler.contains("layout_constraintBottom_toBottomOf");
        boolean hasVertical = hasTop || hasBottom
                || handler.contains("layout_constraintBaseline_toBaselineOf")
                || handler.contains("layout_constraintBaseline_toTopOf")
                || handler.contains("layout_constraintBaseline_toBottomOf");
        boolean hasHorizontal = handler.contains("layout_constraintStart_toStartOf")
                || handler.contains("layout_constraintStart_toEndOf")
                || handler.contains("layout_constraintEnd_toStartOf")
                || handler.contains("layout_constraintEnd_toEndOf")
                || handler.contains("layout_constraintLeft_toLeftOf")
                || handler.contains("layout_constraintLeft_toRightOf")
                || handler.contains("layout_constraintRight_toLeftOf")
                || handler.contains("layout_constraintRight_toRightOf")
                || handler.contains("layout_constraintCircle");

        ConstraintSet set = new ConstraintSet();
        set.clone(parent);
        int id = child.getId();

        if (!hasHorizontal) {
            set.connect(id, ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, dp(0));
            if (bean.layout.width == LayoutBean.LAYOUT_MATCH_PARENT) {
                set.connect(id, ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, dp(0));
            }
        }

        if (!hasVertical) {
            View previous = null;
            for (int i = parent.getChildCount() - 1; i >= 0; i--) {
                View candidate = parent.getChildAt(i);
                if (candidate != child && candidate.getVisibility() == View.VISIBLE && candidate.getId() != View.NO_ID) {
                    previous = candidate;
                    break;
                }
            }
            if (previous != null) {
                set.connect(id, ConstraintSet.TOP, previous.getId(), ConstraintSet.BOTTOM, dp(bean.layout.marginTop));
            } else {
                set.connect(id, ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, dp(bean.layout.marginTop));
            }
        }
        set.applyTo(parent);
        parent.requestLayout();
    }

    private int dp(int value) {
        return (int) ViewUtil.dpToPx(getContext(), (float) value);
    }

    private void applyConstraintAttribute(ConstraintSet constraintSet, ViewGroup container, int childId, ViewBean bean, String attribute, String value) {
        if (value == null || value.isEmpty()) {
            return;
        }
        String normalizedAttribute = attribute;
        if (normalizedAttribute != null && normalizedAttribute.startsWith("layout_constraint")) {
            normalizedAttribute = "app:" + normalizedAttribute;
        } else if (normalizedAttribute != null && normalizedAttribute.startsWith("layout_goneMargin")) {
            normalizedAttribute = "app:" + normalizedAttribute;
        }
        switch (normalizedAttribute) {
            case "app:layout_constraintLeft_toLeftOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.LEFT, ConstraintSet.LEFT, value, bean.layout.marginLeft);
            case "app:layout_constraintLeft_toRightOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.LEFT, ConstraintSet.RIGHT, value, bean.layout.marginLeft);
            case "app:layout_constraintRight_toLeftOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.RIGHT, ConstraintSet.LEFT, value, bean.layout.marginRight);
            case "app:layout_constraintRight_toRightOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.RIGHT, ConstraintSet.RIGHT, value, bean.layout.marginRight);
            case "app:layout_constraintTop_toTopOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.TOP, ConstraintSet.TOP, value, bean.layout.marginTop);
            case "app:layout_constraintTop_toBottomOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.TOP, ConstraintSet.BOTTOM, value, bean.layout.marginTop);
            case "app:layout_constraintBottom_toTopOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.BOTTOM, ConstraintSet.TOP, value, bean.layout.marginBottom);
            case "app:layout_constraintBottom_toBottomOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.BOTTOM, ConstraintSet.BOTTOM, value, bean.layout.marginBottom);
            case "app:layout_constraintStart_toStartOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.START, ConstraintSet.START, value, bean.layout.marginLeft);
            case "app:layout_constraintStart_toEndOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.START, ConstraintSet.END, value, bean.layout.marginLeft);
            case "app:layout_constraintEnd_toStartOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.END, ConstraintSet.START, value, bean.layout.marginRight);
            case "app:layout_constraintEnd_toEndOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.END, ConstraintSet.END, value, bean.layout.marginRight);
            case "app:layout_constraintBaseline_toBaselineOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.BASELINE, ConstraintSet.BASELINE, value, 0);
            case "app:layout_constraintBaseline_toTopOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.BASELINE, ConstraintSet.TOP, value, 0);
            case "app:layout_constraintBaseline_toBottomOf" -> connectConstraint(constraintSet, container, childId, ConstraintSet.BASELINE, ConstraintSet.BOTTOM, value, 0);
            case "app:layout_constraintHorizontal_bias" -> setFloat(value, v -> constraintSet.setHorizontalBias(childId, v));
            case "app:layout_constraintVertical_bias" -> setFloat(value, v -> constraintSet.setVerticalBias(childId, v));
            case "app:layout_constraintWidth_percent" -> setFloat(value, v -> constraintSet.constrainPercentWidth(childId, v));
            case "app:layout_constraintHeight_percent" -> setFloat(value, v -> constraintSet.constrainPercentHeight(childId, v));
            case "app:layout_constraintDimensionRatio" -> constraintSet.setDimensionRatio(childId, value);
            case "app:layout_constraintHorizontal_weight" -> setFloat(value, v -> constraintSet.setHorizontalWeight(childId, v));
            case "app:layout_constraintVertical_weight" -> setFloat(value, v -> constraintSet.setVerticalWeight(childId, v));
            case "app:layout_constraintWidth_default" -> setConstraintDefaultWidth(constraintSet, childId, value);
            case "app:layout_constraintHeight_default" -> setConstraintDefaultHeight(constraintSet, childId, value);
            case "app:layout_constraintWidth_min" -> setConstraintSize(value, v -> constraintSet.constrainMinWidth(childId, v));
            case "app:layout_constraintWidth_max" -> setConstraintSize(value, v -> constraintSet.constrainMaxWidth(childId, v));
            case "app:layout_constraintHeight_min" -> setConstraintSize(value, v -> constraintSet.constrainMinHeight(childId, v));
            case "app:layout_constraintHeight_max" -> setConstraintSize(value, v -> constraintSet.constrainMaxHeight(childId, v));
            case "app:layout_constraintCircle" -> {
                int targetId = resolveConstraintTarget(container, value);
                if (targetId != 0) constraintSet.constrainCircle(childId, targetId, resolveCircleRadius(bean), resolveCircleAngle(bean));
            }
            case "app:layout_goneMarginLeft" -> setGoneMargin(constraintSet, childId, ConstraintSet.LEFT, value);
            case "app:layout_goneMarginTop" -> setGoneMargin(constraintSet, childId, ConstraintSet.TOP, value);
            case "app:layout_goneMarginRight" -> setGoneMargin(constraintSet, childId, ConstraintSet.RIGHT, value);
            case "app:layout_goneMarginBottom" -> setGoneMargin(constraintSet, childId, ConstraintSet.BOTTOM, value);
            case "app:layout_goneMarginStart" -> setGoneMargin(constraintSet, childId, ConstraintSet.START, value);
            case "app:layout_goneMarginEnd" -> setGoneMargin(constraintSet, childId, ConstraintSet.END, value);
            default -> { }
        }
    }

    @FunctionalInterface
    private interface FloatConstraintAction { void apply(float value); }
    @FunctionalInterface
    private interface IntConstraintAction { void apply(int value); }

    private void setFloat(String value, FloatConstraintAction action) {
        try { action.apply(Float.parseFloat(value)); } catch (NumberFormatException ignored) { }
    }

    private void setConstraintSize(String value, IntConstraintAction action) {
        int size = PropertiesUtil.resolveSize(value, 0);
        if (size > 0) action.apply((int) ViewUtil.dpToPx(getContext(), (float) size));
    }

    private void setConstraintDefaultWidth(ConstraintSet set, int id, String value) {
        if ("wrap".equalsIgnoreCase(value)) set.constrainDefaultWidth(id, ConstraintSet.MATCH_CONSTRAINT_WRAP);
        else if ("percent".equalsIgnoreCase(value)) set.constrainDefaultWidth(id, ConstraintSet.MATCH_CONSTRAINT_PERCENT);
        else set.constrainDefaultWidth(id, ConstraintSet.MATCH_CONSTRAINT_SPREAD);
    }

    private void setConstraintDefaultHeight(ConstraintSet set, int id, String value) {
        if ("wrap".equalsIgnoreCase(value)) set.constrainDefaultHeight(id, ConstraintSet.MATCH_CONSTRAINT_WRAP);
        else if ("percent".equalsIgnoreCase(value)) set.constrainDefaultHeight(id, ConstraintSet.MATCH_CONSTRAINT_PERCENT);
        else set.constrainDefaultHeight(id, ConstraintSet.MATCH_CONSTRAINT_SPREAD);
    }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

      - name: Compile check
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java
          git diff --cached --quiet || git commit -m "Fix ConstraintLayout dimensions, bias and smart placement"
          git push origin fix/constraint-preview
