name: Apply Constraint Preview Hardening

on:
  push:
    branches:
      - fix/constraint-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/constraint-preview
          fetch-depth: 0

      - name: Apply ConstraintLayout dimension and smart placement fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pane = Path('app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java')
          s = pane.read_text()

          old = '''            } else if (viewGroup instanceof ItemConstraintLayout constraintLayout) {\n                applyConstraintLayoutConstraints(constraintLayout);\n            }'''
          new = '''            } else if (viewGroup instanceof ItemConstraintLayout constraintLayout) {\n                applyConstraintLayoutConstraints(constraintLayout);\n                applyAutomaticConstraintPlacement(constraintLayout, view, bean);\n                applyConstraintLayoutConstraints(constraintLayout);\n            }'''
          if old in s: s = s.replace(old, new, 1)

          start = s.index('    private void applyConstraintLayoutConstraints(ItemConstraintLayout constraintLayout) {')
          end = s.index('    private void applyConstraintAttribute(', start)
          method = r'''    private void applyConstraintLayoutConstraints(ItemConstraintLayout constraintLayout) {
        if (constraintLayout.getChildCount() == 0) return;
        ConstraintSet set = new ConstraintSet();
        set.clone(constraintLayout);
        for (int i = 0; i < constraintLayout.getChildCount(); i++) {
            View child = constraintLayout.getChildAt(i);
            if (!(child instanceof ItemView itemView) || child.getId() == View.NO_ID) continue;
            ViewBean bean = itemView.getBean();
            applyConstraintDimension(set, child.getId(), bean);
            for (Pair<String, String> attr : new InjectAttributeHandler(bean).getAttributes()) {
                applyConstraintAttribute(set, constraintLayout, child.getId(), bean, attr.first, attr.second);
            }
        }
        set.applyTo(constraintLayout);
        constraintLayout.requestLayout();
        constraintLayout.invalidate();
    }

    private void applyConstraintDimension(ConstraintSet set, int id, ViewBean bean) {
        int w = bean.layout.width;
        int h = bean.layout.height;
        if (w == LayoutBean.LAYOUT_NOTUSED || w == LayoutBean.LAYOUT_MATCH_PARENT) set.constrainWidth(id, 0);
        else if (w == LayoutBean.LAYOUT_WRAP_CONTENT) set.constrainWidth(id, ViewGroup.LayoutParams.WRAP_CONTENT);
        else if (w > 0) set.constrainWidth(id, (int) ViewUtil.dpToPx(getContext(), (float) w));
        if (h == LayoutBean.LAYOUT_NOTUSED || h == LayoutBean.LAYOUT_MATCH_PARENT) set.constrainHeight(id, 0);
        else if (h == LayoutBean.LAYOUT_WRAP_CONTENT) set.constrainHeight(id, ViewGroup.LayoutParams.WRAP_CONTENT);
        else if (h > 0) set.constrainHeight(id, (int) ViewUtil.dpToPx(getContext(), (float) h));
    }

    private void applyAutomaticConstraintPlacement(ItemConstraintLayout parent, View child, ViewBean bean) {
        if (child == null || child.getId() == View.NO_ID || bean == null) return;
        InjectAttributeHandler h = new InjectAttributeHandler(bean);
        boolean vertical = h.contains("layout_constraintTop_toTopOf") || h.contains("layout_constraintTop_toBottomOf")
                || h.contains("layout_constraintBottom_toTopOf") || h.contains("layout_constraintBottom_toBottomOf")
                || h.contains("layout_constraintBaseline_toBaselineOf") || h.contains("layout_constraintBaseline_toTopOf")
                || h.contains("layout_constraintBaseline_toBottomOf");
        boolean horizontal = h.contains("layout_constraintStart_toStartOf") || h.contains("layout_constraintStart_toEndOf")
                || h.contains("layout_constraintEnd_toStartOf") || h.contains("layout_constraintEnd_toEndOf")
                || h.contains("layout_constraintLeft_toLeftOf") || h.contains("layout_constraintLeft_toRightOf")
                || h.contains("layout_constraintRight_toLeftOf") || h.contains("layout_constraintRight_toRightOf")
                || h.contains("layout_constraintCircle");
        ConstraintSet set = new ConstraintSet();
        set.clone(parent);
        int id = child.getId();
        if (!horizontal) {
            set.connect(id, ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);
            if (bean.layout.width == LayoutBean.LAYOUT_MATCH_PARENT) set.connect(id, ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);
        }
        if (!vertical) {
            View previous = null;
            for (int i = parent.getChildCount() - 1; i >= 0; i--) {
                View candidate = parent.getChildAt(i);
                if (candidate != child && candidate.getVisibility() == View.VISIBLE && candidate.getId() != View.NO_ID) { previous = candidate; break; }
            }
            int margin = (int) ViewUtil.dpToPx(getContext(), (float) bean.layout.marginTop);
            if (previous != null) set.connect(id, ConstraintSet.TOP, previous.getId(), ConstraintSet.BOTTOM, margin);
            else set.connect(id, ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, margin);
        }
        set.applyTo(parent);
        parent.requestLayout();
    }

'''
          s = s[:start] + method + s[end:]

          if 'private interface FloatConstraintAction' not in s:
              marker = '    private void connectConstraint(ConstraintSet constraintSet, ViewGroup container, int childId, int sourceSide, int targetSide, String value, int marginDp) {'
              helpers = '''    @FunctionalInterface private interface FloatConstraintAction { void apply(float value); }\n    @FunctionalInterface private interface IntConstraintAction { void apply(int value); }\n    private void setConstraintSize(String value, IntConstraintAction action) { int size = PropertiesUtil.resolveSize(value, 0); if (size > 0) action.apply((int) ViewUtil.dpToPx(getContext(), (float) size)); }\n    private void setConstraintDefaultWidth(ConstraintSet set, int id, String value) {\n        if ("wrap".equalsIgnoreCase(value)) set.constrainDefaultWidth(id, ConstraintSet.MATCH_CONSTRAINT_WRAP);\n        else if ("percent".equalsIgnoreCase(value)) set.constrainDefaultWidth(id, ConstraintSet.MATCH_CONSTRAINT_PERCENT);\n        else set.constrainDefaultWidth(id, ConstraintSet.MATCH_CONSTRAINT_SPREAD);\n    }\n    private void setConstraintDefaultHeight(ConstraintSet set, int id, String value) {\n        if ("wrap".equalsIgnoreCase(value)) set.constrainDefaultHeight(id, ConstraintSet.MATCH_CONSTRAINT_WRAP);\n        else if ("percent".equalsIgnoreCase(value)) set.constrainDefaultHeight(id, ConstraintSet.MATCH_CONSTRAINT_PERCENT);\n        else set.constrainDefaultHeight(id, ConstraintSet.MATCH_CONSTRAINT_SPREAD);\n    }\n\n'''
              if marker not in s: raise SystemExit('connect marker not found')
              s = s.replace(marker, helpers + marker, 1)

          old = '''            case "app:layout_constraintWidth_percent" -> {\n                try {\n                    constraintSet.constrainPercentWidth(childId, Float.parseFloat(value));\n                } catch (NumberFormatException ignored) {\n                }\n            }\n            case "app:layout_constraintHeight_percent" -> {\n                try {\n                    constraintSet.constrainPercentHeight(childId, Float.parseFloat(value));\n                } catch (NumberFormatException ignored) {\n                }\n            }'''
          new = '''            case "app:layout_constraintWidth_percent" -> {\n                try { constraintSet.constrainDefaultWidth(childId, ConstraintSet.MATCH_CONSTRAINT_PERCENT); constraintSet.constrainPercentWidth(childId, Float.parseFloat(value)); } catch (NumberFormatException ignored) { }\n            }\n            case "app:layout_constraintHeight_percent" -> {\n                try { constraintSet.constrainDefaultHeight(childId, ConstraintSet.MATCH_CONSTRAINT_PERCENT); constraintSet.constrainPercentHeight(childId, Float.parseFloat(value)); } catch (NumberFormatException ignored) { }\n            }\n            case "app:layout_constraintWidth_default" -> setConstraintDefaultWidth(constraintSet, childId, value);\n            case "app:layout_constraintHeight_default" -> setConstraintDefaultHeight(constraintSet, childId, value);\n            case "app:layout_constraintWidth_min" -> setConstraintSize(value, v -> constraintSet.constrainMinWidth(childId, v));\n            case "app:layout_constraintWidth_max" -> setConstraintSize(value, v -> constraintSet.constrainMaxWidth(childId, v));\n            case "app:layout_constraintHeight_min" -> setConstraintSize(value, v -> constraintSet.constrainMinHeight(childId, v));\n            case "app:layout_constraintHeight_max" -> setConstraintSize(value, v -> constraintSet.constrainMaxHeight(childId, v));'''
          if old in s: s = s.replace(old, new, 1)
          pane.write_text(s)

          factory = Path('app/src/main/java/pro/sketchware/tools/ViewBeanFactory.java')
          f = factory.read_text()
          old = '''        var orientation = attributes.getOrDefault("android:orientation", null);\n        if (orientation != null) {'''
          new = '''        var orientation = attributes.getOrDefault("android:orientation", null);\n        if (bean.type == ViewBeans.VIEW_TYPE_LAYOUT_CONSTRAINTLAYOUT) orientation = null;\n        if (orientation != null) {'''
          if old in f: f = f.replace(old, new, 1)
          factory.write_text(f)
          PY

      - name: Compile check
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java app/src/main/java/pro/sketchware/tools/ViewBeanFactory.java
          git diff --cached --quiet && exit 0
          git commit -m "fix: support ConstraintLayout dimensions and smart drop placement"
          git push origin fix/constraint-preview
