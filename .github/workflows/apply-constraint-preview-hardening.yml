name: Apply Constraint Preview Hardening

on:
  push:
    branches:
      - fix/constraint-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/constraint-preview
          fetch-depth: 0

      - name: Fix ConstraintLayout attribute application
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pane = Path('app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java')
          s = pane.read_text()

          # XmlPullParser returns namespace-free attribute names (for example
          # layout_constraintStart_toEndOf, not app:layout_constraintStart_toEndOf).
          # The existing ConstraintSet switch used prefixed names, so none of
          # the real ConstraintLayout XML attributes were ever applied.
          old = '''    private void applyConstraintAttribute(ConstraintSet constraintSet, ViewGroup container, int childId, ViewBean bean, String attribute, String value) {\n        if (value == null || value.isEmpty()) {\n            return;\n        }\n        switch (attribute) {'''
          new = '''    private void applyConstraintAttribute(ConstraintSet constraintSet, ViewGroup container, int childId, ViewBean bean, String attribute, String value) {\n        if (value == null || value.isEmpty()) {\n            return;\n        }\n        // InjectAttributeHandler uses XmlPullParser, whose getAttributeName()\n        // removes the XML namespace prefix. Normalize constraint attributes so\n        // both parser output and any prefixed callers use the same switch.\n        String normalizedAttribute = attribute;\n        if (normalizedAttribute != null && normalizedAttribute.startsWith("layout_constraint")) {\n            normalizedAttribute = "app:" + normalizedAttribute;\n        } else if (normalizedAttribute != null && normalizedAttribute.startsWith("layout_goneMargin")) {\n            normalizedAttribute = "app:" + normalizedAttribute;\n        }\n        switch (normalizedAttribute) {'''
          if old not in s:
              raise SystemExit('Constraint attribute method anchor not found')
          s = s.replace(old, new, 1)

          # Re-apply constraints whenever an existing ConstraintLayout child is
          # refreshed, not only when a drag/drop operation inserts it.
          old = '''        if (viewBean.parentType == ViewBean.VIEW_TYPE_LAYOUT_RELATIVE) {\n            updateRelative(view, injectHandler);\n        }\n        if (classInfo.matchesType("TextView")) {'''
          new = '''        if (viewBean.parentType == ViewBean.VIEW_TYPE_LAYOUT_RELATIVE) {\n            updateRelative(view, injectHandler);\n        }\n        if (viewBean.parentType == ViewBeans.VIEW_TYPE_LAYOUT_CONSTRAINTLAYOUT\n                && rootLayout != null) {\n            View parentView = rootLayout.findViewWithTag(viewBean.parent);\n            if (parentView instanceof ItemConstraintLayout constraintLayout) {\n                // The child may already be attached during normal refresh.\n                // Applying the complete container constraint set keeps the\n                // preview synchronized with the XML after edits.\n                applyConstraintLayoutConstraints(constraintLayout);\n            }\n        }\n        if (classInfo.matchesType("TextView")) {'''
          if old not in s:
              raise SystemExit('updateItemView anchor not found')
          s = s.replace(old, new, 1)

          pane.write_text(s)
          PY

      - name: Harden ConstraintLayout preview lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pane = Path('app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java')
          s = pane.read_text()

          old = '''            ViewGroup viewGroup = rootLayout.findViewWithTag(viewBean.preParent);\n            viewGroup.removeView(findViewWithTag);\n            if (viewGroup instanceof ScrollContainer scrollContainer) {'''
          new = '''            ViewGroup viewGroup = rootLayout.findViewWithTag(viewBean.preParent);\n            if (viewGroup == null || findViewWithTag == null) {\n                LogUtil.w("ViewPane", "Unable to move preview view '" + viewBean.id + "': previous parent not found");\n                return (ItemView) findViewWithTag;\n            }\n            viewGroup.removeView(findViewWithTag);\n            if (viewGroup instanceof ScrollContainer scrollContainer) {'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''        } else if (viewBean.index != viewBean.preIndex) {\n            ((ViewGroup) rootLayout.findViewWithTag(viewBean.parent)).removeView(findViewWithTag);\n            addViewAndUpdateIndex(findViewWithTag);'''
          new = '''        } else if (viewBean.index != viewBean.preIndex) {\n            ViewGroup currentParent = rootLayout.findViewWithTag(viewBean.parent);\n            if (currentParent == null || findViewWithTag == null) {\n                LogUtil.w("ViewPane", "Unable to reorder preview view '" + viewBean.id + "': parent not found");\n                return (ItemView) findViewWithTag;\n            }\n            currentParent.removeView(findViewWithTag);\n            addViewAndUpdateIndex(findViewWithTag);'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''        constraintSet.applyTo(constraintLayout);\n    }'''
          new = '''        constraintSet.applyTo(constraintLayout);\n        constraintLayout.requestLayout();\n        constraintLayout.invalidate();\n    }'''
          if old in s and 'constraintLayout.requestLayout();' not in s:
              s = s.replace(old, new, 1)

          pane.write_text(s)

          factory = Path('app/src/main/java/pro/sketchware/tools/ViewBeanFactory.java')
          s = factory.read_text()
          old = '''        var orientation = attributes.getOrDefault("android:orientation", null);\n        if (orientation != null) {'''
          new = '''        var orientation = attributes.getOrDefault("android:orientation", null);\n        // ConstraintLayout has no orientation concept. Do not let a stray\n        // android:orientation attribute affect preview layout state.\n        if (bean.type == ViewBeans.VIEW_TYPE_LAYOUT_CONSTRAINTLAYOUT) {\n            orientation = null;\n        }\n        if (orientation != null) {'''
          if old in s and 'ConstraintLayout has no orientation concept' not in s:
              s = s.replace(old, new, 1)
          factory.write_text(s)
          PY

      - name: Verify ConstraintLayout preview fixes
        run: |
          grep -n "XmlPullParser\|normalizedAttribute\|applyConstraintLayoutConstraints(constraintLayout)\|constraintLayout.requestLayout\|ConstraintLayout has no orientation" \
            app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java \
            app/src/main/java/pro/sketchware/tools/ViewBeanFactory.java

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pro/sketchware/activities/editor/view/ViewPane.java app/src/main/java/pro/sketchware/tools/ViewBeanFactory.java
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply ConstraintLayout XML constraints in preview"
          git push origin fix/constraint-preview