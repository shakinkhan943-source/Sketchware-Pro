name: Generate ImportModel

on:
  workflow_dispatch:
  push:
    paths:
      - "model.py"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run model.py
        run: |
          python model.py

      - name: Check ImportModel.zip
        run: |
          if [ ! -f "ImportModel.zip" ]; then
            echo "ERROR: ImportModel.zip was not generated!"
            exit 1
          fi

          echo "Found ImportModel.zip:"
          ls -lh ImportModel.zip

      - name: Upload ImportModel.zip
        uses: actions/upload-artifact@v4
        with:
          name: ImportModel
          path: ImportModel.zip
          if-no-files-found: error
