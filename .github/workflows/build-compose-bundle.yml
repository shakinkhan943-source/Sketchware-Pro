name: Build Compose Bundle

on:
  workflow_dispatch:
    inputs:
      compose_ui_version:
        description: 'COMPOSE_UI_VERSION'
        required: false
        default: '1.7.8'
      compose_material3_version:
        description: 'COMPOSE_MATERIAL3_VERSION'
        required: false
        default: '1.3.1'
      activity_compose_version:
        description: 'ACTIVITY_COMPOSE_VERSION'
        required: false
        default: '1.9.3'
      navigation_compose_version:
        description: 'NAVIGATION_COMPOSE_VERSION'
        required: false
        default: '2.8.5'
      lifecycle_compose_version:
        description: 'LIFECYCLE_COMPOSE_VERSION'
        required: false
        default: '2.8.7'
      android_compile_sdk:
        description: 'ANDROID_COMPILE_SDK'
        required: false
        default: 'android-36'
  push:
    branches:
      - main

jobs:
  build-compose-bundle:
    name: Build Compose bundle (separate from built-in libs)
    runs-on: ubuntu-latest

    env:
      OUT_DIR: build/compose-bundle/out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Android SDK command-line tools + platform & build-tools
        id: android-setup
        run: |
          set -e
          export ANDROID_SDK_ROOT="${GITHUB_WORKSPACE}/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp
          mkdir -p latest
          mv temp/cmdline-tools/* latest/ || true
          rm -rf temp cmdline-tools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36" "build-tools;34.0.0" "platform-tools"

      - name: Show environment
        run: |
          echo "ANDROID_SDK_ROOT=${GITHUB_WORKSPACE}/android-sdk"
          echo "OUT_DIR=${{ env.OUT_DIR }}"
          echo "COMPOSE_UI_VERSION=${{ github.event.inputs.compose_ui_version || '1.7.8' }}"

      - name: Run Compose bundle builder (no install into repo assets)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_COMPILE_SDK: ${{ github.event.inputs.android_compile_sdk || 'android-36' }}
          ANDROID_JAR: ${{ github.workspace }}/android-sdk/platforms/${{ github.event.inputs.android_compile_sdk || 'android-36' }}/android.jar
          COMPOSE_UI_VERSION: ${{ github.event.inputs.compose_ui_version || '1.7.8' }}
          COMPOSE_MATERIAL3_VERSION: ${{ github.event.inputs.compose_material3_version || '1.3.1' }}
          ACTIVITY_COMPOSE_VERSION: ${{ github.event.inputs.activity_compose_version || '1.9.3' }}
          NAVIGATION_COMPOSE_VERSION: ${{ github.event.inputs.navigation_compose_version || '2.8.5' }}
          LIFECYCLE_COMPOSE_VERSION: ${{ github.event.inputs.lifecycle_compose_version || '2.8.7' }}
        run: |
          set -e
          mkdir -p "${{ env.OUT_DIR }}"
          python3 scripts/compose/compose_cli.py --android-sdk-root "${{ github.workspace }}/android-sdk" --out-dir "${{ github.workspace }}/${{ env.OUT_DIR }}" --overwrite

      - name: List outputs
        run: |
          echo "Contents of out dir:"
          ls -la "${{ env.OUT_DIR }}" || true
          echo "If compose-libs.zip and compose-libraries.json are missing the build failed."

      - name: Upload compose-libs.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-libs-zip
          path: ${{ env.OUT_DIR }}/compose-libs.zip

      - name: Upload compose-libraries.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-libraries-json
          path: ${{ env.OUT_DIR }}/compose-libraries.json

      - name: Upload entire OUT dir (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-bundle-out
          path: ${{ env.OUT_DIR }}
