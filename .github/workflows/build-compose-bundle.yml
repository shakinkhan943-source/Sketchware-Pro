name: Build built-in Jetpack Compose bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/compose/**'
      - '.github/workflows/build-compose-bundle.yml'
      - 'app/src/main/java/pro/sketchware/core/project/BuildConfig.java'
      - 'app/src/main/java/pro/sketchware/core/build/ProjectFilePaths.java'
      - 'app/src/main/java/pro/sketchware/core/build/ProjectBuilder.java'
      - 'app/src/main/java/pro/sketchware/core/build/compiler/ResourceCompiler.java'
  push:
    paths:
      - 'scripts/compose/**'
      - '.github/workflows/build-compose-bundle.yml'

permissions:
  contents: write

jobs:
  build-compose-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Generate minimal resolved Compose bundle
        id: generate_bundle
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          mkdir -p build/compose-bundle
          python3 scripts/compose/build_compose_bundle.py 2>&1 | tee build/compose-bundle/ci-output.log

      - name: Save debug log on failure
        if: failure() && steps.generate_bundle.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts/compose/.ci-debug
          cp build/compose-bundle/ci-output.log "scripts/compose/.ci-debug/last-failure.log" || true
          cp build/compose-bundle/resolver.gradle "scripts/compose/.ci-debug/last-resolver.gradle" || true
          git add scripts/compose/.ci-debug
          if git diff --cached --quiet; then
            echo "No debug log to commit."
            exit 0
          fi
          git commit -m "ci: save Compose bundle failure log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Configure GitHub CLI authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          gh repo view --json nameWithOwner

      - name: Commit generated Compose bundle
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/libs/compose-libs.zip app/src/main/assets/libs/compose-libraries.json
          if git diff --cached --quiet; then
            echo "Compose bundle is already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate built-in Compose dependency bundle"
          git push
