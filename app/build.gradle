plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    compileSdk = 36

    def gitCommitHash = "git rev-parse HEAD".execute().text.trim()
    def shortCommitHash = "git rev-parse --short HEAD".execute().text.trim()

    defaultConfig {
        applicationId = "pro.sketchware"
        namespace = "pro.sketchware"
        targetSdk = 35
        minSdk = 26
        versionCode = 162
        versionName = "v8.0.0"
        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")
        buildConfigField("String", "SKETCHUB_API_KEY", "\"${System.getenv("SKETCHUB_API_KEY")}\"")
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // These bundled/prebuilt libraries are not strip-compatible. Keep their
            // symbols and let AGP package them unchanged instead of warning/failing
            // during native library stripping.
            keepDebugSymbols += "**/*.so"

            // libaapt2.so is not a shared library loaded via System.loadLibrary() — it is
            // the AAPT2 *executable* that ProjectBuilder runs with ProcessBuilder from
            // ApplicationInfo.nativeLibraryDir. That directory is only populated when the
            // package installer extracts native libraries out of the APK.
            //
            // Since AGP 3.6, extractNativeLibs defaults to "false" whenever minSdk >= 23
            // (ours is 26), so the .so stays compressed inside the APK, nativeLibraryDir is
            // left empty and the build fails with:
            //     SketchwareException: AAPT2 binary is missing at /data/app/.../lib/arm/libaapt2.so
            //
            // useLegacyPackaging = true is the AGP 4.2+ DSL replacement for
            // android:extractNativeLibs="true" and forces the installer to extract the
            // binary to disk, where it can be chmod +x'd and exec'd. Do not remove this:
            // executing a binary from anywhere else (app data dir, cache) is blocked by
            // the W^X SELinux policy for targetSdk >= 29.
            //
            // This also covers app bundle installs. The old gradle.properties flag
            // android.bundle.enableUncompressedNativeLibs was REMOVED in AGP 8.1 and now
            // hard-fails plugin application, so this DSL option is the only supported
            // way to request compressed/extracted native libs for both APKs and AABs.
            useLegacyPackaging = true
        }
        resources {
            excludes += "license/*"
            excludes += "META-INF/DEPENDENCIES"
            pickFirsts += "api_database/*"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        additionalParameters.addAll("--stable-ids", "${rootDir}/public-stable-ids.txt")
    }

    signingConfigs {
        debug {
            storeFile = file("../testkey.keystore")
            storePassword = "testkey"
            keyAlias = "testkey"
            keyPassword = "testkey"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    configurations.implementation {
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-compiler-embeddable"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-common"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-jvm"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-script-runtime"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation libs.bundles.ui
    implementation libs.bundles.image
    implementation platform(libs.sora.editor)
    implementation libs.bundles.editor.and.lang
    implementation libs.bundles.coil
    implementation libs.bundles.bundletool
    implementation(libs.sdklib) {
        exclude group: "com.intellij", module: "annotations"
    }
    implementation libs.bundles.shrinker
    implementation libs.zipalign.java
    implementation libs.gson
    implementation libs.scpkix.jdk15on
    implementation libs.markwon
    implementation libs.bundles.networking
    implementation libs.ecj
    implementation libs.stax.api
    implementation libs.bundles.kotlin.compiler
    compileOnly libs.kotlin.compiler
    implementation project(':resolver')
    implementation project(':vendor-dx')
    implementation libs.filepicker
    implementation libs.libsu
    implementation libs.insetter
    implementation(libs.javaparser.symbol.solver) {
        exclude group: "com.google.guava", module: "guava"
    }
    implementation platform(libs.firebase.bom)
    implementation libs.bundles.firebase
    coreLibraryDesugaring libs.desugar.jdk.libs.nio
}

/*
 * The Compose compiler plugin is shipped as plain JAR assets and provisioned
 * into each project's kt_plugins directory at build time. The plugin has a
 * runtime dependency on the matching Kotlin stdlib, so this configuration is
 * intentionally transitive and the refresh task copies both artifacts.
 */
configurations {
    composeCompilerPlugin {
        transitive = true
    }
}

dependencies {
    composeCompilerPlugin libs.compose.compiler.plugin
}

tasks.register("refreshComposeCompilerPlugin", Copy) {
    group = "build setup"
    description = "Refreshes the bundled Kotlin Compose compiler plugin and its runtime dependencies"
    from(configurations.composeCompilerPlugin) {
        include "*.jar"
    }
    into rootProject.file("app/src/main/assets/libs/kt_plugins")
}

// Always refresh the tiny plugin dependency set before packaging the APK so the
// asset directory cannot contain a plugin without its matching runtime JAR.
tasks.named("preBuild") {
    dependsOn(tasks.named("refreshComposeCompilerPlugin"))
}
